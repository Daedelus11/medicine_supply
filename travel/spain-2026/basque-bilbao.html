.section-body { display: none; }

  const stopsList = document.createElement('div');
  stopsList.className = 'stops';

  sec.stops.forEach((stop) => {
    if (stop.transit) {
      const t = document.createElement('div');
      t.className = 'transit';
      t.innerHTML = '<span class="transit-icon">' + stop.transit.icon + '</span> ' + stop.transit.text;
      stopsList.appendChild(t);
    }

    const el = document.createElement('div');
    el.className = 'stop';
    el.dataset.stopId = stop.id;

    const numCol = document.createElement('div');
    numCol.className = 'stop-num-col';
    numCol.innerHTML = '<div class="stop-num" id="snum-' + stop.id + '">' + (stop.id + 1) + '</div><div class="stop-line"></div>';

    const linkHtml = stop.link
      ? '<a class="stop-link" href="' + stop.link + '" target="_blank" rel="noopener">⇗ Book</a>'
      : '';

    const bodyEl = document.createElement('div');
    bodyEl.className = 'stop-body';
    bodyEl.innerHTML =
      '<div class="stop-time">' + stop.time + '</div>' +
      '<div class="stop-name">' + stop.name + '</div>' +
      '<div class="stop-desc">' + stop.desc + '</div>' +
      '<div class="stop-actions">' +
        '<span class="stop-tag ' + stop.tagClass + '">' + stop.tagText + '</span>' +
        linkHtml +
      '</div>';

    el.appendChild(numCol);
    el.appendChild(bodyEl);
    el.addEventListener('click', function(e) {
      if (e.target.closest('.stop-link')) return;
      focusStop(stop.id);
      body.classList.add('open');
      toggle.classList.add('open');
    });
    stopsList.appendChild(el);
  });

  body.appendChild(stopsList);
  group.appendChild(toggle);
  group.appendChild(body);
  container.appendChild(group);
});

// Bilbao center as default view
const map = L.map('map', { center: [43.268, -2.934], zoom: 13 });
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19
}).addTo(map);

const markers = [];

function makeIcon(stop, active) {
  const size = active ? 36 : 28, border = active ? 3 : 2;
  const bg = stop.color;
  const textColor = bg === '#fec422' ? '#1a1a18' : '#fff';
  const borderColor = active ? '#fff' : 'rgba(255,255,255,0.3)';
  return L.divIcon({
    className: '',
    html: '<div style="width:' + size + 'px;height:' + size + 'px;border-radius:50%;background:' + bg + ';border:' + border + 'px solid ' + borderColor + ';display:flex;align-items:center;justify-content:center;font-family:\'IBM Plex Mono\',monospace;font-size:' + (active ? '0.72' : '0.62') + 'rem;font-weight:600;color:' + textColor + ';box-shadow:0 2px 12px rgba(0,0,0,0.5);">' + (stop.id + 1) + '</div>',
    iconSize: [size, size], iconAnchor: [size/2, size/2],
  });
}

ALL_STOPS.forEach(function(stop) {
  const popupContent =
    '<div class="popup-time">' + stop.time + '</div>' +
    '<div class="popup-name">' + stop.name + '</div>' +
    '<div class="popup-note">' + stop.note + '</div>';

  const marker = L.marker([stop.lat, stop.lng], { icon: makeIcon(stop, stop.id === 0) })
    .addTo(map)
    .bindPopup(popupContent, { className: 'custom-popup', maxWidth: 280 })
    .on('click', function() { focusStop(stop.id); });

  markers.push({ id: stop.id, marker });
});

var activeStopId = 0;

function focusStop(id) {
  const stop = ALL_STOPS.find(s => s.id === id);
  if (!stop) return;
  markers.forEach(function(m) {
    m.marker.setIcon(makeIcon(ALL_STOPS.find(s => s.id === m.id), m.id === id));
  });
  document.querySelectorAll('.stop').forEach(function(el) {
    const isActive = parseInt(el.dataset.stopId) === id;
    el.classList.toggle('active', isActive);
    if (isActive) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
  map.setView([stop.lat, stop.lng], stop.lat < 43 ? 12 : 15, { animate: true, duration: 0.5 });
  markers.find(m => m.id === id).marker.openPopup();
  activeStopId = id;
}

setTimeout(function() { markers.find(m => m.id === 0).marker.openPopup(); }, 500);

document.addEventListener('keydown', function(e) {
  const ids = ALL_STOPS.map(s => s.id);
  const idx = ids.indexOf(activeStopId);
  if ((e.key === 'ArrowDown' || e.key === 'ArrowRight') && idx < ids.length - 1) focusStop(ids[idx + 1]);
  if ((e.key === 'ArrowUp' || e.key === 'ArrowLeft') && idx > 0) focusStop(ids[idx - 1]);
});
</script>
</body>
