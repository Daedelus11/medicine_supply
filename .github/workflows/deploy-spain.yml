name: Deploy Spain 2026 to fine-linestudio.com

on:
  push:
    branches: [ main ]
    paths:
      - 'travel/spain-2026/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTP (TLS Explicit)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./travel/2026/
          server-dir: /travel/2026/
          exclude: |
            **/.git*
            **/.git*/**
